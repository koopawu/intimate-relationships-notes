 <h2 class="sec-title">关于这份笔记</h2>
 <div class="preface-card">
  <h3>写在前面</h3>
  <p>我是一名心理咨询师，最近自己也饱受爱情的困扰。这份笔记既是专业精读，也是一场自我疗愈。</p>
  <p>罗兰·米勒的《亲密关系》（第6版）是这个领域公认的集大成之作——它不谈鸡汤，只谈证据。我用咨询师的视角逐章精读，把823页原书浓缩为十四章笔记：每章先给一句话主旨，再拆知识框架、详解核心观点，最后附上关键数据、名词速查和我的一段"咨询师手记"。书末另附2016年本书出版之后的前沿研究作为对照。</p>
  <p>写给自己的，也写给每一个在关系里认真磕碰过的人。</p>
  <p class="sig">—— 一位仍在学习爱的咨询师</p>
 </div>
